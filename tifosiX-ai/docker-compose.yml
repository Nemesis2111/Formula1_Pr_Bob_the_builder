version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: tifosix-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: tifosix-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped