services:
  backend:
    build:
      context: ./backend
    container_name: tifosix-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ws://localhost:5173/ws
    container_name: tifosix-frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend
    restart: unless-stopped